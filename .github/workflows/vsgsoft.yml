# Platform build steps adapted from rustdesk/rustdesk 1.5.1.
name: VSGSoft client
'on':
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build a new release even if this configuration is published
        type: boolean
        default: false
  schedule:
  - cron: 23 4 * * *
  push:
    branches:
    - vsgsoft
    paths:
    - vsgsoft/**
    - .github/workflows/vsgsoft.yml
    - VSGSOFT.md
permissions:
  contents: read
concurrency:
  group: vsgsoft-release
  cancel-in-progress: false
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
jobs:
  prepare:
    name: Synchronize latest stable source
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.sync.outputs.version }}
      sha: ${{ steps.sync.outputs.sha }}
      tag: ${{ steps.sync.outputs.tag }}
      build: ${{ steps.sync.outputs.build }}
      upstream: ${{ steps.sync.outputs.upstream }}
    steps:
    - name: Checkout custom branch
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: vsgsoft
        fetch-depth: 1
    - name: Synchronize upstream and apply server defaults
      id: sync
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE_REBUILD: ${{ inputs.force_rebuild }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python3 vsgsoft/sync.py
  bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-22.04
          extra-build-args: ''
          flutter-version: 3.22.3
          artifact-name: bridge-artifact
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ needs.prepare.outputs.sha }}
        submodules: recursive
        persist-credentials: false
    - name: Install prerequisites
      run: |
        sudo apt-get install ca-certificates -y
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          cmake \
          curl \
          gcc \
          git \
          g++ \
          libclang-dev \
          libgtk-3-dev \
          llvm-dev \
          nasm \
          ninja-build \
          pkg-config \
          wget
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: bridge-${{ matrix.job.os }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ matrix.job.flutter-version }}
        cache: true
    - name: Install flutter rust bridge deps
      shell: bash
      run: |
        cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
        cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
        if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
          # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
        else
          # Flutter 3.44 bridge for Windows arm64: match that build's source/pubspec state so the
          # generated *.freezed.dart compiles against the same Flutter/freezed it resolves.
          bash .github/patches/apply_flutter_3.44_source_patches.sh
        fi
        pushd flutter && flutter pub get && popd
    - name: Run flutter rust bridge
      run: |
        ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
        cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.job.artifact-name }}
        path: |
          ./src/bridge_generated.rs
          ./src/bridge_generated.io.rs
          ./flutter/lib/generated_bridge.dart
          ./flutter/lib/generated_bridge.freezed.dart
          ./flutter/macos/Runner/bridge_generated.h
          ./flutter/ios/Runner/bridge_generated.h
    name: Generate Flutter bridge
    needs:
    - prepare
    if: needs.prepare.outputs.build == 'true'
    timeout-minutes: 60
    env:
      CARGO_EXPAND_VERSION: 1.0.95
      FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
      RUST_VERSION: '1.75'
  topmost:
    runs-on: windows-2022
    strategy:
      fail-fast: false
    env:
      project_path: WindowInjection/WindowInjection.vcxproj
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/x64/Release
    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
    - name: Download the source code
      run: |
        git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
    - name: Build the project
      run: |
        cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
        msbuild ${{ env.project_path }} -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
    - name: Archive build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: topmostwindow-artifacts-x64
        path: |
          ./${{ env.build_output_dir }}/WindowInjection.dll
    name: Build Windows window helper
    needs:
    - prepare
    if: needs.prepare.outputs.build == 'true'
    timeout-minutes: 30
  windows:
    name: Windows x64
    needs:
    - prepare
    - bridge
    - topmost
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ needs.prepare.outputs.sha }}
        submodules: recursive
        persist-credentials: false
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        architecture: x64
    - name: Replace engine with rustdesk custom flutter engine
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
    - name: Patch flutter
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash
    - name: Build rustdesk
      run: |
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
        mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

        # Download usbmmidd_v2.zip and extract it to ./rustdesk
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
        Expand-Archive usbmmidd_v2.zip -DestinationPath .
        Remove-Item -Path usbmmidd_v2\Win32 -Recurse
        Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
        mv -Force .\usbmmidd_v2 ./rustdesk

        # Download printer driver files and extract them to ./rustdesk
        try {
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

          # Check and move the files
          $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
          $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
          $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
          $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
          if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
          } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
          } else {
              Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
          }
        } catch {
            Write-Host "Ingore the printer driver error."
        }
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: |
        runner_res=$(find . -name "Runner.res");
        if [ "$runner_res" == "" ]; then
          echo "Runner.res: not found";
        else
          echo "Runner.res: $runner_res";
          cp $runner_res ./libs/portable/Runner.res;
          echo "list ./libs/portable/Runner.res";
          ls -l ./libs/portable/Runner.res;
        fi
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: topmostwindow-artifacts-x64
        path: ./rustdesk
    - name: Build self-extracted executable
      shell: bash
      run: |
        python3 vsgsoft/verify_binary.py rustdesk
        sed -i '/dpiAware/d' res/manifest.xml
        pushd ./libs/portable
        pip3 install -r requirements.txt
        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
        popd
        mkdir -p ./SignOutput
        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      with:
        msbuild-architecture: ${{ matrix.job.arch == 'aarch64' && 'arm64' || 'x86' }}
    - name: Build msi
      run: |
        pushd ./res/msi
        python preprocess.py --arp -d ../../rustdesk
        nuget restore msi.sln
        $msiPlatform = if ('${{ matrix.job.arch }}' -eq 'aarch64') { 'ARM64' } else { 'x64' }
        msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10
        $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
        mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.msi
        sha256sum ../../SignOutput/rustdesk-*.msi
    - name: Collect VSGSoft packages
      shell: bash
      run: python3 vsgsoft/package.py windows x86_64
    - name: Upload VSGSoft packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dist-windows-x86_64
        path: dist/*
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
    if: needs.prepare.outputs.build == 'true'
  macos:
    name: macOS ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    needs:
    - prepare
    - bridge
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-apple-darwin
          os: macos-15-intel
          extra-build-args: ''
          extra-cargo-features: ''
          arch: x86_64
          vcpkg-triplet: x64-osx
        - target: aarch64-apple-darwin
          os: macos-14
          extra-build-args: --screencapturekit
          extra-cargo-features: ',screencapturekit'
          arch: aarch64
          vcpkg-triplet: arm64-osx
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ needs.prepare.outputs.sha }}
        submodules: recursive
        persist-credentials: false
    - name: Install build runtime
      run: |
        brew install llvm create-dmg
        # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
        if command -v pkg-config &>/dev/null; then
            echo "pkg-config is already installed"
        else
            brew install pkg-config
        fi
    - name: Install NASM
      run: |
        # Install NASM 2.16.x from official release.
        # Do NOT use `brew install nasm` which installs NASM 3.x.
        # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
        unzip nasm-2.16.03-macosx.zip
        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
        nasm --version
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Workaround for flutter issue
      shell: bash
      run: |
        cd "$(dirname "$(which flutter)")"
        # https://github.com/flutter/flutter/issues/133533
        sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
        grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.MAC_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
    - name: Show version information (Rust, cargo, Clang)
      shell: bash
      run: |
        clang --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V
    - name: Build rustdesk
      run: |
        if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
        fi
        ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}
    - name: Verify embedded server profile
      run: python3 vsgsoft/verify_binary.py flutter/build/macos/Build/Products/Release/RustDesk.app
    - name: create unsigned dmg
      run: |
        CREATE_DMG="$(command -v create-dmg)"
        CREATE_DMG="$(readlink -f "$CREATE_DMG")"
        sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
        create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app
    - name: Rename rustdesk
      shell: bash
      env:
        VERSION: ${{ env.VERSION }}
        ARCH: ${{ matrix.job.arch }}
      run: |
        if [ -f "rustdesk-${VERSION}.dmg" ]; then
            mv "rustdesk-${VERSION}.dmg" "rustdesk-${VERSION}-${ARCH}.dmg"
        fi
        test -f "rustdesk-${VERSION}-${ARCH}.dmg"
    - name: Collect VSGSoft packages
      shell: bash
      run: python3 vsgsoft/package.py macos ${{ matrix.job.arch }}
    - name: Upload VSGSoft packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dist-macos-${{ matrix.job.arch }}
        path: dist/*
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
    if: needs.prepare.outputs.build == 'true'
  linux:
    needs:
    - prepare
    - bridge
    name: Linux x64
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: x86_64
          target: x86_64-unknown-linux-gnu
          distro: ubuntu18.04
          deb_arch: amd64
          vcpkg-triplet: x64-linux
          'on': ubuntu-22.04
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Maximize build space
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo apt-get update -y
        sudo apt-get install -y nasm
        if [[ "${{ matrix.job.arch }}" == "x86_64" ]]; then
          sudo apt-get install -y qemu-user-static
        fi
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ needs.prepare.outputs.sha }}
        submodules: recursive
        persist-credentials: false
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c
      with:
        swap-size-gb: 12
    - name: Free Space
      run: |
        df -h
        free -m
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - name: Save Rust toolchain version
      run: |
        RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
        echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV
    - name: Disable rust bridge build
      run: |
        # only build cdylib
        sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        sudo apt install -y libva-dev && apt show libva-dev
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash
    - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
      name: Build rustdesk
      id: vcpkg
      with:
        arch: ${{ matrix.job.arch }}
        distro: ${{ matrix.job.distro }}
        githubToken: ${{ github.token }}
        setup: |
          ls -l "${PWD}"
          ls -l /opt/artifacts/vcpkg/installed
        dockerRunArgs: |
          --volume "${PWD}:/workspace"
          --volume "/opt/artifacts:/opt/artifacts"
        shell: /bin/bash
        install: |
          apt-get update -y
          echo -e "installing deps"
          apt-get install -y \
             build-essential \
             clang \
             cmake \
             curl \
             gcc \
             git \
             g++ \
             libayatana-appindicator3-dev \
             libasound2-dev \
             libclang-10-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             llvm-10-dev \
             nasm \
             ninja-build \
             pkg-config \
             tree \
             python3 \
             rpm \
             unzip \
             wget \
             xz-utils \
             libssl-dev
          # we have libopus compiled by us.
          apt-get remove -y libopus-dev || true
          # output devs
          ls -l ./
          tree -L 3 /opt/artifacts/vcpkg/installed
        run: |
          # disable git safe.directory
          git config --global --add safe.directory "*"
          # rust
          pushd /opt
          # do not use rustup, because memory overflow in qemu
          wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}.tar.gz
          tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
          cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }} && ./install.sh
          rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}
          # edit config
          mkdir -p ~/.cargo/
          echo """
            [source.crates-io]
            registry = 'https://github.com/rust-lang/crates.io-index'
          """ > ~/.cargo/config
          cat ~/.cargo/config
          # start build
          pushd /workspace
          export VCPKG_ROOT=/opt/artifacts/vcpkg
          if [[ "${{ matrix.job.arch }}" == "aarch64" ]]; then
            export JOBS="--jobs 3"
          else
            export JOBS=""
          fi
          echo $JOBS
          cargo build --locked --lib $JOBS --features hwcodec,flutter,unix-file-copy-paste --release
          python3 vsgsoft/verify_binary.py target/release/liblibrustdesk.so
          rm -rf target/release/deps target/release/build
          rm -rf ~/.cargo

          # Setup Flutter
          # disable git safe.directory
          git config --global --add safe.directory "*"
          pushd /workspace
          case ${{ matrix.job.arch }} in
            aarch64)
              export PATH=/opt/flutter-elinux/bin:$PATH
              sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
              sed -i "s/x64\/release/arm64\/release/g" ./build.py
            ;;
            x86_64)
              export PATH=/opt/flutter/bin:$PATH
            ;;
          esac
          popd
          pushd /opt
          wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
          tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
          case ${{ matrix.job.arch }} in
            aarch64)
              # clone repo and reset to flutter ${{ env.FLUTTER_VERSION }}
              git clone https://github.com/sony/flutter-elinux.git || true
              pushd flutter-elinux
                git fetch
                git reset --hard ${{ env.FLUTTER_VERSION }}
                bin/flutter-elinux doctor -v
                bin/flutter-elinux precache --linux
              popd
              cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
              rm -rf flutter
            ;;
            x86_64)
              flutter doctor -v
            ;;
          esac

          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            case ${{ matrix.job.arch }} in
              aarch64)
                pushd /opt/flutter-elinux/flutter
              ;;
              x86_64)
                pushd /opt/flutter
              ;;
            esac
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
            popd
          fi

          # build flutter
          pushd /workspace
          export CARGO_INCREMENTAL=0
          export DEB_ARCH=${{ matrix.job.deb_arch }}
          python3 ./build.py --flutter --skip-cargo
          for name in rustdesk*??.deb; do
            mv "$name" "${name%%.deb}-${{ matrix.job.arch }}.deb"
          done

          # rpm package
          echo -e "start packaging fedora package"
          pushd /workspace
          case ${{ matrix.job.arch }} in
            aarch64)
              sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter.spec
              ;;
          esac
          HBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb
          pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
          for name in rustdesk*??.rpm; do
              mv "$name" /workspace/"${name%%.rpm}.rpm"
          done

          # rpm suse package
          echo -e "start packaging suse package"
          pushd /workspace
          case ${{ matrix.job.arch }} in
            aarch64)
              sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter-suse.spec
              ;;
          esac
          HBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb
          pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
          for name in rustdesk*??.rpm; do
              mv "$name" /workspace/"${name%%.rpm}-suse.rpm"
          done
    - name: Collect VSGSoft packages
      shell: bash
      run: python3 vsgsoft/package.py linux x86_64
    - name: Upload VSGSoft packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dist-linux-x86_64
        path: dist/*
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
    if: needs.prepare.outputs.build == 'true'
  publish:
    name: Publish release and download page
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs:
    - prepare
    - windows
    - macos
    - linux
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: write
      pages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout exact published source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ needs.prepare.outputs.sha }}
        submodules: recursive
        persist-credentials: false
    - name: Download all platform packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Publish complete GitHub Release
      run: python3 vsgsoft/publish.py
    - name: Configure Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
    - name: Upload download page
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
      with:
        path: site
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-22.04
    needs:
    - publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
